title: Resident Handbook
description: >-
  Companion Exotic Animal Medicine and Surgery Service —
  House Officer Handbook. UC Davis Veterinary Medical Teaching Hospital.
url: ""
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# just-the-docs settings
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true

aux_links:
  "Download EPUB":
    - "/assets/downloads/resident-handbook.epub"
  "Download .docx":
    - "/assets/downloads/resident-handbook.docx"
  "View on GitHub":
    - "https://github.com/hbeaufrere/resident-handbook"

aux_links_new_tab: true

footer_content: >-
  Updated 05/2026 ·
  <a href="https://github.com/hbeaufrere/resident-handbook">View on GitHub</a>

# Where chapter pages live
defaults:
  - scope:
      path: "docs"
    values:
      layout: default

include:
  - docs

exclude:
  - source/
  - .tmp/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - script/

collections_dir: collections

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
